{% extends 'base.html' %}{% block content %}<div class="tabs"><button onclick="showTab('workshops')">车间</button><button onclick="showTab('products')">产品</button><button onclick="showTab('machines')">设备</button></div><div id="masterContent"></div>{% endblock %}{% block scripts %}<script>
let all={},current='workshops';const labels={workshops:'车间',products:'产品',machines:'设备'};const definitions={workshops:[['workshop_code','车间编号'],['workshop_name','车间名称']],products:[['product_code','产品编号'],['product_name','产品名称'],['product_category','产品分类'],['unit','单位']],machines:[['machine_code','设备编号'],['machine_name','设备名称'],['workshop_code','车间编号'],['status','状态'],['current_product','当前产品'],['updated_at','更新时间']]};
async function load(){all=await getJSON('/api/master-data');showTab(current)}function showTab(name){current=name;const fields=definitions[name],rows=all[name]||[];masterContent.innerHTML=`<div class="card"><h2>${labels[name]}主数据</h2><form id="masterForm" class="inline-form">${fields.map(([k,n])=>`<label>${n}<input name="${k}" required></label>`).join('')}<button class="btn primary">新增或更新</button></form><div class="table-wrap"><table><thead><tr>${fields.map(x=>`<th>${x[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(x=>`<td>${r[x[0]]??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;masterForm.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(masterForm));const r=await fetch('/api/master-data/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();toast(j.message,j.success?'ok':'error');if(j.success)load()}}load();
</script>{% endblock %}
