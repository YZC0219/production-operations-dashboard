{% extends 'base.html' %}{% block content %}<div class="card form-card"><h2>修改登录密码</h2>{% if session.must_change_password %}<div class="warning-box">首次登录必须修改初始密码后才能使用系统。</div>{% endif %}<form id="passwordForm"><label>当前密码<input type="password" name="current_password" required></label><label>新密码<input type="password" name="new_password" minlength="10" required><small>至少 10 位，并包含字母和数字。</small></label><button class="btn primary">保存新密码</button></form></div>{% endblock %}{% block scripts %}<script>passwordForm.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/password',{method:'POST',body:new FormData(passwordForm)}),j=await r.json();if(j.success){toast(j.message);setTimeout(()=>location.href='/',700)}else toast(j.message,'error')}</script>{% endblock %}
