{% extends 'base.html' %}{% block content %}<div class="toolbar"><select id="status"><option value="">全部订单状态</option><option>待生产</option><option>生产中</option><option>待交付</option><option>已完成</option><option>已逾期</option></select><input id="search" placeholder="搜索订单号或客户"></div><div class="card table-wrap"><table><thead><tr><th>订单编号</th><th>客户</th><th>产品</th><th>订单数量</th><th>已生产</th><th>已交付</th><th>下单日期</th><th>交付日期</th><th>状态</th><th>剩余天数</th></tr></thead><tbody id="body"></tbody></table></div>{% endblock %}{% block scripts %}<script>loadTable('/api/orders',d=>{const draw=()=>{let q=search.value.trim();body.innerHTML=d.filter(x=>(!status.value||x.status===status.value)&&(!q||x.order_code.includes(q)||x.customer_name.includes(q))).map(x=>`<tr class="${x.warning==='逾期'?'row-danger':x.warning==='临近'?'row-warn':''}"><td>${x.order_code}</td><td>${x.customer_name}</td><td>${x.product_name}</td><td>${x.order_quantity}</td><td>${x.produced_quantity}</td><td>${x.delivered_quantity}</td><td>${x.order_date}</td><td>${x.delivery_date}</td><td><span class="badge ${badgeClass(x.status)}">${x.status}</span></td><td>${x.remaining_days<0?'逾期 '+Math.abs(x.remaining_days)+' 天':x.remaining_days+' 天'}</td></tr>`).join('')||emptyRow(10)};[status,search].forEach(e=>e.addEventListener('input',draw));draw()})</script>{% endblock %}
