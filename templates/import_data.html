{% extends 'base.html' %}{% block content %}<div class="import-grid"><div class="card upload"><h2>导入 Excel 数据</h2><p>请选择符合模板结构的 .xlsx 文件。系统会先校验并预览，不会直接写入数据库。</p><input id="file" type="file" accept=".xlsx"><div><button class="btn" id="previewBtn">校验并预览</button><button class="btn primary" id="importBtn" disabled>确认导入</button></div><a class="download" href="{{url_for('download_template')}}">↓ 下载示例 Excel 模板</a></div><div class="card"><h2>文件要求</h2><ul><li>最大 10MB，仅支持 .xlsx</li><li>必须含 5 个指定工作表</li><li>字段名称请勿修改</li><li>校验失败时不会写入任何数据</li></ul></div></div><div id="preview" class="preview"></div>{% endblock %}{% block scripts %}<script>let validated=false;async function submit(action){const f=file.files[0];if(!f)return toast('请先选择文件','error');const fd=new FormData();fd.append('file',f);fd.append('action',action);try{const r=await fetch('/api/import',{method:'POST',body:fd}),j=await r.json();if(!j.success)throw Error(j.message);toast(j.message);if(action==='preview'){validated=true;importBtn.disabled=false;preview.innerHTML=Object.entries(j.data).map(([n,v])=>`<div class="card"><h2>${n} <small>共 ${v['总行数']} 行</small></h2><div class="table-wrap"><table><thead><tr>${Object.keys(v['预览'][0]||{}).map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${v['预览'].map(row=>`<tr>${Object.values(row).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('')}else{preview.innerHTML='<div class="success-box">数据导入成功，看板已更新。</div>'}}catch(e){validated=false;importBtn.disabled=true;toast(e.message,'error')}}previewBtn.onclick=()=>submit('preview');importBtn.onclick=()=>validated&&submit('import');file.onchange=()=>{validated=false;importBtn.disabled=true;preview.innerHTML=''}</script>{% endblock %}
