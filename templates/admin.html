{% extends 'base.html' %}{% block content %}<div class="admin-grid"><div class="card"><h2>新增用户</h2><form id="userForm" class="stack-form"><label>用户名<input name="username" required></label><label>显示名称<input name="display_name" required></label><label>角色<select name="role"><option value="viewer">只读用户</option><option value="operator">操作员</option><option value="admin">管理员</option></select></label><label>初始密码<input name="password" type="password" minlength="10" required></label><button class="btn primary">创建用户</button></form></div><div class="card table-wrap"><h2>用户列表</h2><table><thead><tr><th>用户名</th><th>名称</th><th>角色</th><th>状态</th><th>最后登录</th></tr></thead><tbody id="usersBody"></tbody></table></div></div><div class="card table-wrap"><h2>操作日志（最近500条）</h2><table><thead><tr><th>时间</th><th>用户</th><th>动作</th><th>对象</th><th>结果</th><th>IP</th><th>详情</th></tr></thead><tbody id="logsBody"></tbody></table></div>{% endblock %}{% block scripts %}<script>const roles={admin:'管理员',operator:'操作员',viewer:'只读用户'};async function loadAdmin(){const [u,l]=await Promise.all([getJSON('/api/users'),getJSON('/api/audit-logs')]);usersBody.innerHTML=u.map(x=>`<tr><td>${x.username}</td><td>${x.display_name}</td><td>${roles[x.role]}</td><td>${x.enabled?'启用':'禁用'}</td><td>${x.last_login_at||'-'}</td></tr>`).join('');logsBody.innerHTML=l.map(x=>`<tr><td>${x.created_at}</td><td>${x.username}</td><td>${x.action}</td><td>${x.target_type} ${x.target_id||''}</td><td>${x.result}</td><td>${x.ip_address}</td><td>${x.detail}</td></tr>`).join('')}userForm.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(userForm));const r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();toast(j.message,j.success?'ok':'error');if(j.success){userForm.reset();loadAdmin()}};loadAdmin()</script>{% endblock %}
