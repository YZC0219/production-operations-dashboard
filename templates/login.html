<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户登录</title><link rel="stylesheet" href="{{url_for('static',filename='css/main.css')}}"></head><body class="login-body"><form class="login-card" method="post"><div class="login-logo">PO</div><h1>生产运营管理看板</h1><p>请使用授权账户登录</p>{% if error %}<div class="form-error">{{error}}</div>{% endif %}<label>用户名<input name="username" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">登录</button><small>首次登录：admin / Admin@123456</small></form></body></html>
