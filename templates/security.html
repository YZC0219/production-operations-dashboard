{% extends 'base.html' %}{% block content %}<div class="admin-grid"><div class="card"><h2>数据库备份</h2><p class="muted">创建 SQLite 一致性备份并下载到本机。建议定期复制到另一块磁盘。</p><button class="btn primary" id="backupBtn">立即备份并下载</button></div><div class="card"><h2>定时采集</h2><p>采集线程随系统自动启动，当前周期为 <strong id="interval">--</strong> 秒。</p><div id="devices"></div></div></div><div class="card"><h2>安全检查</h2><div id="checks" class="check-list"></div></div>{% endblock %}{% block scripts %}<script>async function loadSecurity(){const [c,r]=await Promise.all([getJSON('/api/security-checks'),getJSON('/api/realtime/status')]);checks.innerHTML=c.map(x=>`<div class="check ${x.ok?'pass':'warn'}"><b>${x.ok?'✓':'!'}</b><span><strong>${x.item}</strong><small>${x.detail}</small></span></div>`).join('');interval.textContent=r.poll_interval_seconds;devices.innerHTML=r.devices.map(x=>`<p>${x.machine_code} · ${x.ip} · ${x.driver}</p>`).join('')}backupBtn.onclick=async()=>{const r=await fetch('/api/backup',{method:'POST'});if(!r.ok)return toast('备份失败','error');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=r.headers.get('content-disposition')?.match(/filename=([^;]+)/)?.[1]||'backup.db';a.click();toast('备份已创建')};loadSecurity()</script>{% endblock %}
