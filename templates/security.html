{% extends 'base.html' %}{% block content %}<div class="admin-grid"><div class="card"><h2>数据库备份</h2><p class="muted">创建 SQLite 一致性备份并下载到本机。</p><button class="btn primary" id="backupBtn">立即备份并下载</button><button class="btn" id="runBackupBtn">执行服务器备份</button><h2>自动备份</h2><form id="backupForm"><label>启用<select name="enabled"><option value="true">是</option><option value="false">否</option></select></label><label>每天执行小时（0-23）<input name="hour" type="number" min="0" max="23"></label><label>保留天数<input name="retention_days" type="number" min="1" max="365"></label><button class="btn primary">保存设置</button></form></div><div class="card"><h2>定时采集</h2><p>采集线程随系统自动启动，当前周期为 <strong id="interval">--</strong> 秒。</p><div id="devices"></div></div></div><div class="card"><h2>安全检查</h2><div id="checks" class="check-list"></div></div>{% endblock %}{% block scripts %}<script>async function loadSecurity(){const [c,r,b]=await Promise.all([getJSON('/api/security-checks'),getJSON('/api/realtime/status'),getJSON('/api/backup-config')]);checks.innerHTML=c.map(x=>`<div class="check ${x.ok?'pass':'warn'}"><b>${x.ok?'✓':'!'}</b><span><strong>${x.item}</strong><small>${x.detail}</small></span></div>`).join('');interval.textContent=r.poll_interval_seconds;devices.innerHTML=r.devices.map(x=>`<p>${x.machine_code} · ${x.ip} · ${x.driver}</p>`).join('');backupForm.enabled.value=String(b.enabled);backupForm.hour.value=b.hour;backupForm.retention_days.value=b.retention_days}backupBtn.onclick=async()=>{const r=await fetch('/api/backup',{method:'POST'});if(!r.ok)return toast('备份失败','error');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='production_backup.db';a.click();toast('备份已创建')};runBackupBtn.onclick=async()=>{const r=await fetch('/api/backup-run',{method:'POST'}),j=await r.json();toast(j.message,j.success?'ok':'error');loadSecurity()};backupForm.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(backupForm));d.enabled=d.enabled==='true';d.hour=Number(d.hour);d.retention_days=Number(d.retention_days);const r=await fetch('/api/backup-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();toast(j.message,j.success?'ok':'error')};loadSecurity()</script>{% endblock %}
