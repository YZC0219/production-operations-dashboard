{% extends 'base.html' %}{% block content %}<div class="card"><h2>最近24小时设备综合效率</h2><p class="muted">时间开动率基于实时采样；性能开动率基于今日计划与实时产量；质量率基于合格品占比。</p><div class="table-wrap"><table><thead><tr><th>设备</th><th>采样数</th><th>时间开动率</th><th>性能开动率</th><th>质量率</th><th>OEE</th></tr></thead><tbody id="oeeBody"></tbody></table></div></div>{% endblock %}{% block scripts %}<script>async function loadOee(){const d=await getJSON('/api/oee');oeeBody.innerHTML=d.map(x=>`<tr><td>${x.machine_code} · ${x.machine_name}</td><td>${x.samples}</td><td>${x.availability}%</td><td>${x.performance}%</td><td>${x.quality}%</td><td><strong class="${x.oee>=85?'good':x.oee>=60?'warn-text':'bad'}">${x.oee}%</strong></td></tr>`).join('')}loadOee();setInterval(loadOee,5000)</script>{% endblock %}
