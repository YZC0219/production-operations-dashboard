{% extends 'base.html' %}{% block content %}<div class="card"><h2>PLC 设备配置</h2><div class="toolbar"><label>采集周期（秒）<input id="pollInterval" type="number" min="1" max="3600"></label><button class="btn" onclick="addDevice()">添加设备</button><button class="btn primary" onclick="saveAll()">保存配置</button></div><p class="muted">真实 PLC 使用 s7 驱动；现场联调前可使用 simulation。连接测试仅检查 TCP 102 端口。</p><div id="deviceList"></div></div>{% endblock %}{% block scripts %}<script>
let config={devices:[]};const fields=[['machine_code','设备编号'],['name','名称'],['ip','IP地址'],['driver','驱动'],['rack','Rack'],['slot','Slot'],['tcp_port','端口'],['db_number','DB号'],['read_start','起始字节'],['read_size','读取长度']];
async function load(){config=await getJSON('/api/device-config');pollInterval.value=config.poll_interval_seconds;render()}function render(){deviceList.innerHTML=config.devices.map((d,i)=>`<div class="device-editor"><div class="inline-form">${fields.map(([k,n])=>`<label>${n}${k==='driver'?`<select data-i="${i}" data-k="${k}"><option ${d[k]==='simulation'?'selected':''}>simulation</option><option ${d[k]==='s7'?'selected':''}>s7</option></select>`:`<input data-i="${i}" data-k="${k}" value="${d[k]??''}">`}</label>`).join('')}<label>启用<select data-i="${i}" data-k="enabled"><option value="true" ${d.enabled?'selected':''}>是</option><option value="false" ${!d.enabled?'selected':''}>否</option></select></label></div><button class="btn" onclick="testDevice(${i})">测试连接</button><button class="btn" onclick="removeDevice(${i})">移除</button></div>`).join('');deviceList.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{let v=e.value;if(['rack','slot','tcp_port','db_number','read_start','read_size'].includes(e.dataset.k))v=Number(v);if(e.dataset.k==='enabled')v=v==='true';config.devices[e.dataset.i][e.dataset.k]=v})}function addDevice(){config.devices.push({enabled:true,driver:'simulation',machine_code:'',name:'',ip:'192.168.1.10',rack:0,slot:1,tcp_port:102,db_number:1,read_start:0,read_size:14,mapping:{status_byte:0,actual_quantity_dint:2,qualified_quantity_dint:6,defective_quantity_dint:10}});render()}function removeDevice(i){config.devices.splice(i,1);render()}async function saveAll(){config.poll_interval_seconds=Number(pollInterval.value);const r=await fetch('/api/device-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)}),j=await r.json();toast(j.message,j.success?'ok':'error');if(j.success)load()}async function testDevice(i){const d=config.devices[i],r=await fetch('/api/device-test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip:d.ip,port:d.tcp_port})}),j=await r.json();toast(j.data?.message||j.message,j.data?.success?'ok':'error')}load();
</script>{% endblock %}
