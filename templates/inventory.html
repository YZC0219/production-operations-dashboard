{% extends 'base.html' %}{% block content %}<div class="toolbar"><select id="type"><option value="">全部物料类型</option><option>原材料</option><option>半成品</option><option>成品</option></select><select id="status"><option value="">全部库存状态</option><option>正常</option><option>库存不足</option><option>库存过高</option></select><input id="search" placeholder="搜索编号或物料名称"></div><div class="card table-wrap"><table><thead><tr><th>物料编号</th><th>物料名称</th><th>类型</th><th>当前库存</th><th>安全库存</th><th>最大库存</th><th>单位</th><th>仓库位置</th><th>库存状态</th><th>更新时间</th></tr></thead><tbody id="body"></tbody></table></div>{% endblock %}{% block scripts %}<script>loadTable('/api/inventory',d=>{const draw=()=>{let q=search.value.trim();body.innerHTML=d.filter(x=>(!type.value||x.material_type===type.value)&&(!status.value||x.inventory_status===status.value)&&(!q||x.material_code.includes(q)||x.material_name.includes(q))).map(x=>`<tr class="${x.inventory_status==='库存不足'?'row-danger':x.inventory_status==='库存过高'?'row-warn':''}"><td>${x.material_code}</td><td>${x.material_name}</td><td>${x.material_type}</td><td>${x.current_stock}</td><td>${x.safety_stock}</td><td>${x.maximum_stock}</td><td>${x.unit}</td><td>${x.warehouse_location}</td><td><span class="badge ${badgeClass(x.inventory_status)}">${x.inventory_status}</span></td><td>${x.updated_at}</td></tr>`).join('')||emptyRow(10)};[type,status,search].forEach(e=>e.addEventListener('input',draw));draw()})</script>{% endblock %}
