{% extends 'base.html' %}{% block content %}<div class="kpis"><div class="kpi"><span>活动报警</span><strong id="activeCount">0</strong></div><div class="kpi"><span>已确认</span><strong id="ackCount">0</strong></div><div class="kpi"><span>已恢复</span><strong id="recoveredCount">0</strong></div></div><div class="card table-wrap"><table><thead><tr><th>状态</th><th>级别</th><th>设备</th><th>类型</th><th>报警内容</th><th>发生时间</th><th>确认人</th><th>恢复时间</th><th>操作</th></tr></thead><tbody id="alarmBody"></tbody></table></div>{% endblock %}{% block scripts %}<script>async function loadAlarms(){const d=await getJSON('/api/alarms');activeCount.textContent=d.filter(x=>x.status==='活动').length;ackCount.textContent=d.filter(x=>x.status==='已确认').length;recoveredCount.textContent=d.filter(x=>x.status==='已恢复').length;alarmBody.innerHTML=d.map(x=>`<tr class="${x.status==='活动'?'row-danger':''}"><td><span class="badge ${x.status==='活动'?'b-red':x.status==='已恢复'?'b-green':'b-orange'}">${x.status}</span></td><td>${x.level}</td><td>${x.machine_code}</td><td>${x.alarm_type}</td><td>${x.message}</td><td>${x.started_at}</td><td>${x.acknowledged_by||'-'}</td><td>${x.recovered_at||'-'}</td><td>${x.status==='活动'&&['admin','operator'].includes('{{session.role}}')?`<button class="btn" onclick="ack(${x.id})">确认</button>`:'-'}</td></tr>`).join('')||emptyRow(9)}async function ack(id){const note=prompt('请输入处理说明：')||'';const r=await fetch(`/api/alarms/${id}/acknowledge`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})}),j=await r.json();toast(j.message,j.success?'ok':'error');loadAlarms()}loadAlarms();setInterval(loadAlarms,5000)</script>{% endblock %}
