{% extends 'base.html' %}{% block content %}<div class="toolbar"><select id="status"><option value="">全部计划状态</option><option>未开始</option><option>生产中</option><option>已完成</option><option>延期</option></select><input id="search" placeholder="搜索计划、设备或产品"></div><div class="card table-wrap"><table><thead><tr><th>计划编号</th><th>设备编号</th><th>产品编号</th><th>产品名称</th><th>计划日期</th><th>计划数量</th><th>已完成</th><th>完成率</th><th>状态</th></tr></thead><tbody id="body"></tbody></table></div>{% endblock %}{% block scripts %}<script>loadTable('/api/plans',d=>{const draw=()=>{let q=search.value.trim();body.innerHTML=d.filter(x=>(!status.value||x.status===status.value)&&(!q||[x.plan_code,x.machine_code,x.product_name].some(v=>v.includes(q)))).map(x=>`<tr><td>${x.plan_code}</td><td>${x.machine_code}</td><td>${x.product_code}</td><td>${x.product_name}</td><td>${x.plan_date}</td><td>${x.planned_quantity}</td><td>${x.completed_quantity}</td><td><div class="progress"><i style="width:${x.completion_rate}%"></i></div><small>${x.completion_rate}%</small></td><td><span class="badge ${badgeClass(x.status)}">${x.status}</span></td></tr>`).join('')||emptyRow(9)};[status,search].forEach(e=>e.addEventListener('input',draw));draw()})</script>{% endblock %}
